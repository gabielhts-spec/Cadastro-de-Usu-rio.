<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <title>Cadastro de Usuário</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        

        <form id="form-cadastro">

            <h1>Cadastro de Usuário</h1>

            <div class="input-box">
                <input id="senha" placeholder="Senha" type="password" required>
                <i class="bx bxs-lock-alt"></i>
            </div>

                <div class="input-box">
                <input id="login" placeholder="login" type="text" required>
                <i class="bx bxs-user"></i>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox">
                    lembrar a senha
                </label>

                <a href="#">Esqueci a senha</a>
                
            </div>

            <div class="input-box">
                <input id="nome" type="text" placeholder="Nome" required>
                <i class="bx bxs-user"></i>
            </div>

            <div class="input-box">
                <input id="nascimento" type="text" placeholder="Data de nascimento" required>
                <i class="bx bxs-calendar"></i>
            </div>

            <div class="input-box">
                <input id="cpf" type="text" placeholder="CPF" required>
                <i class="bx bxs-id-card"></i>
            </div>

            <div class="input-box">
                <input id="endereco" type="Endereço" placeholder="Endereço completo" required>
                <i class="bx bxs-home"></i>
            </div>

            <div class="input-box">
                <input id="telefone" type="text" placeholder="Telefone" required>
                <i class="bx bxs-phone"></i>
            </div>

             <div class="input-box">
                <input id="celular" type="text" placeholder="celular" required>
                <i class="bx bxs-phone"></i>
            </div>

            <div class="input-box">
                <input id="confirmar-senha" type="text" placeholder="Confirmar senha" required>
                <i class="bx bxs-lock-alt"></i>

            </div>

            <div class="input-box campo-central">
                <input id="nome-materno" type="text" placeholder="Nome materno" required>
                <i class="bx bxs-user"></i>
            </div>

    <div text-align="center">
        <button type="button" class="limpar">limpar</button>
        <button type="submit" class="enviar">enviar</button>
    </div>
            

            <div class="register-link">
                <p>Já tem uma conta? <a href="#">Faça login</a></p>
            </div>

            

        </form>

    </div>

    
    <script src="script.js"></script>

</body>
</html>
